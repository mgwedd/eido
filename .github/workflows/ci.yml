name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    # Pinned: the Tesseract package versions below are Ubuntu 24.04's; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base parent, for the change filter
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Tesseract (parser OCR test, #261)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr=5.3.4-1build5 tesseract-ocr-eng=1:4.1.0-2
          tesseract --version
      - name: Check named invariant tests
        run: pnpm check:invariants
      # The checks are one turbo run, defined by scripts/verify.ts and turbo.json: edit those to change CI and
      # `pnpm verify` together. Pull requests that only touch docs or images run the light steps;
      # every push to main runs everything.
      - name: Verify
        run: pnpm verify --full

  # The gate's Bridge tests (local fake IMAP and SMTP) and its Windows named-pipe support (ADR 0003)
  # must hold off Linux too. The full check run stays on Linux in `check`.
  gate-os:
    name: gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Gate tests
        run: pnpm turbo run test --filter=@eido/gate

  # The gate's confined file helper (packages/gate/native/file-helper, ADR 0006). Rust, no crates; the
  # toolchain comes from the runner's preinstalled rustup, pinned by rust-toolchain.toml.
  file-helper:
    name: file helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: packages/gate/native/file-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # The gate's own wrapper, roots and audit against the real binary on each OS. Other gate tests
      # mock the helper, so `pnpm verify` and turbo never need cargo.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm (version pinned by packageManager)
        working-directory: .
        run: corepack enable
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Build release helper
        run: cargo build --release --locked
      - name: Gate tests against the native helper
        run: |
          dir=$(pwd -W 2>/dev/null || pwd)
          bin="$dir/target/release/eido-file-helper"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cd ../../
          EIDO_FILE_HELPER="$bin" pnpm exec vitest run src/internal/files/file-helper.native.test.ts
