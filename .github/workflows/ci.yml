name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base parent, for the change filter
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The checks are one turbo run, defined by scripts/verify.mjs and turbo.json: edit those to change CI and
      # `pnpm verify` together. Pull requests that only touch docs or images run the light steps;
      # every push to main runs everything.
      - name: Verify
        run: pnpm verify --full

  # The gate's Bridge tests (local fake IMAP and SMTP) and its Windows named-pipe support (ADR 0003)
  # must hold off Linux too. The full check run stays on Linux in `check`.
  gate-os:
    name: gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Gate tests
        run: pnpm turbo run test --filter=@eido/gate
