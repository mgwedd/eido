packages:
  - "apps/*"
  - "packages/*"
  - "infra"
  - "scripts"

# Install hardening: no dependency install scripts except this allowlist,
# and no versions published in the last 7 days (value is in minutes).
onlyBuiltDependencies:
  - esbuild
  - sharp
minimumReleaseAge: 10080
# Already pinned in the lockfile before the 7-day rule; remove once they age out (2026-10-23).
# vitest and the @vitest/* packages (incl. coverage-v8, which must equal vitest) (5.0.5, published 2026-10-15); remove both from here on 2026-10-22.
minimumReleaseAgeExclude:
  - turbo
  - "@turbo/*"
  - eslint-plugin-turbo
  - "@vitest/*"
  - vitest
  # Security patches (#292), published 2026-10-17..22; remove once they age out on 2026-10-29.
  - postal-mime
  - nodemailer
  - happy-dom
  - body-parser
  - fast-uri
strictDepBuilds: true
# pdfjs-dist (core's PDF parser, #43) lists a native canvas as optional; the parsers only read text
# and raw image pixels, so the native module is never installed.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
# Patched versions of transitive dependencies with security advisories (#286, #292).
overrides:
  brace-expansion: 5.0.12
  baseline-browser-mapping: 2.11.29
  body-parser: 2.4.0
  fast-uri: 3.1.9
